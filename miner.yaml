version: "1"
kind: miner
id: 0
slug: telegraph-trust-risk
protocol: generic
name: Telegraph Trust Risk Intelligence
description: Multi-signal trust and risk analysis for URLs, text authenticity, AI text detection, and content verification.
base_url: https://replace-with-deployed-miner.example
auth:
  type: none
endpoints:
  - path: /v1/analyze
    external_path: /v1/analyze
    method: POST
    description: Analyze one supported intent using a JSON request envelope.
limitations:
  - code: MAX_BODY_SIZE
    message: Request bodies must not exceed 128 KiB.
    property: size_bytes
    value_bytes: 131072
    operator: lte
semantics:
  signal_mapping:
    confidence_field: result.confidence
    label_field: result.verdict
    reason_field: result.evidence
  supported_intents:
    - URL_SCAN
    - AI_TEXT_DETECTION
    - TEXT_AUTHENTICITY_CHECK
    - CONTENT_VERIFICATION
